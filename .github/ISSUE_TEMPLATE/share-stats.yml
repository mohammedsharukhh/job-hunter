name: 📊 Share my results (anonymous)
description: Paste the JSON from `share_stats.py` (or ask Claude "share my job-hunter stats") to help publish real response rates.
title: "stats"
labels: ["stats"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Only paste the JSON produced by `scripts/share_stats.py`. It contains counts and rates only — no names, companies, emails or job titles. Re-submitting later with the same `submission_id` updates your entry.
  - type: textarea
    id: stats
    attributes:
      label: Stats JSON
      description: Paste the JSON exactly as generated.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I reviewed the JSON and agree to it being published in aggregate.
          required: true
