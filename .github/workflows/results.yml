name: Update community results
on:
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: "17 3 * * 1"   # weekly
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  aggregate:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'stats')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/aggregate_stats.py --from-gh "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit if changed
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/RESULTS.md README.md
          git diff --cached --quiet || (git commit -m "Update community results" && git push)
